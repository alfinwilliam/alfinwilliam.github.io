# Site settings
title: "Alfin William"
description: "DevOps engineer. AWS, Kubernetes, Terraform."
url: "https://alfinwilliam.github.io"
baseurl: ""
lang: en
author:
  name: "Alfin William"

# Number of posts shown on the home page
post_limit: 4

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Do not change this: it decides the URL of every post.
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - preview.sh

# This post opens with a heading, which would otherwise become its search and
# link-preview description.
defaults:
  - scope:
      path: "_posts/2020-11-06-jiofi-hack.md"
    values:
      description: "JioFi3 Speed hack"
