---
layout: default
---

<article class="post">
  <header>
    <h1 class="post__title">{{ page.title }}</h1>
    <time class="post__date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <p class="post__back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
