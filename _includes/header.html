<header class="site-header">
  <div class="wrap site-header__inner">
    {% unless page.url == '/' %}
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    {% endunless %}
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="{{ '/#about' | relative_url }}">About</a></li>
        <li><a href="{{ '/#blog' | relative_url }}">Blog</a></li>
        <li><a href="{{ '/#hobbies' | relative_url }}">Hobbies</a></li>
      </ul>
    </nav>
    {% if site.data.projects and site.data.projects.size > 0 %}
    <nav class="site-nav site-nav--sites" aria-label="My other sites">
      <ul>
        {% for project in site.data.projects %}
        <li><a href="{{ project.url }}">{{ project.name }}<svg class="ext-icon" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M3.5 8.5l5-5M4.5 3.5h4v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></li>
        {% endfor %}
      </ul>
    </nav>
    {% endif %}
  </div>
</header>
