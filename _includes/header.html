<header class="site-header">

    {% endunless %}
    <nav class="site-nav" aria-label="Main">
      <ul>
        <li><a href="{{ '/#about' | relative_url }}">About</a></li>
        <li><a href="{{ '/#blog' | relative_url }}">Blog</a></li>
        <li><a href="{{ '/#hobbies' | relative_url }}">Hobbies</a></li>
      </ul>
    </nav>
  </div>
</header>
