<header class="site-header">
  <div class="wrap site-header__inner">
    {% unless page.url == '/' %}
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    {% endunless %}
    {% comment %} Wide screens: one row of links. Phones: a Menu button that opens the same links as a list. {% endcomment %}
    <nav class="site-nav" aria-label="Main">
      {% include nav-links.html %}
    </nav>
    <details class="site-menu">
      <summary>
        Menu
        <svg class="site-menu__icon site-menu__icon--open" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="site-menu__icon site-menu__icon--close" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </summary>
      <nav class="site-menu__panel" aria-label="Main">
        {% include nav-links.html %}
      </nav>
    </details>
  </div>
</header>
