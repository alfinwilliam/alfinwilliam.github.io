    .track, .done { fill: none; stroke-width: 10; }
    .track { stroke: #c6e9e2; }
    .done { stroke: #0f766e; }
    .knob { fill: #0b5a54; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #122b29; }
      .floor { fill: #1a3f3b; }
      .paper { fill: #0d1112; }
      .accent { fill: #2dd4bf; }
